id = "shindakun.goat-herdr"
name = "Goat Herdr"
version = "0.1.1"
min_herdr_version = "0.9.0"
description = "Alerts when an agent needs you. Telegram with a two-way bridge, ntfy, Slack, JSON webhook."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/goat-herdr", "notify"]

[[events]]
on = "pane.closed"
command = ["./target/release/goat-herdr", "notify"]

[[events]]
on = "pane.exited"
command = ["./target/release/goat-herdr", "notify"]

[[startup]]
command = ["./target/release/goat-herdr", "bridge", "--detach"]

[[actions]]
id = "test"
title = "Send test alert"
command = ["./target/release/goat-herdr", "test"]

[[actions]]
id = "toggle"
title = "Toggle alerts"
command = ["./target/release/goat-herdr", "toggle"]

[[actions]]
id = "bridge"
title = "Restart bridge"
command = ["./target/release/goat-herdr", "bridge", "--detach"]
