[package]
name = "goat-herdr"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin that alerts you when an agent needs you"
license = "MIT"
repository = "https://github.com/shindakun/goat-herdr"
readme = "README.md"
keywords = ["herdr", "telegram", "ntfy", "alerts"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
